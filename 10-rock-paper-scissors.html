<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rock Paper Scissors</title>

		<style>
			body {
				background-color: rgb(25, 25, 25);
				color: white;
				font-family: Arial, Helvetica, sans-serif;
			}

			.title {
				font-size: 30px;
				font-weight: bold;
			}

			.move-icon {
				height: 50px;
			}
		</style>
	</head>

	<body>
		<p class="title">Rock Paper Scissors</p>
		<button onclick="playGame('rock');">
			<img src="/images/rock-emoji.png" alt="Rock Image" class="move-icon" />
		</button>

		<button onclick="playGame('paper');">
			<img src="/images/paper-emoji.png" alt="Paper emoji" class="move-icon" />
		</button>

		<button onclick="playGame('scissors'); ">
			<img src="/images/scissors-emoji.png" alt="Scissors" class="move-icon" />
		</button>

		<p class="js-result"></p>

		<p class="js-moves"></p>

		<p class="js-score"></p>

		<button
			onclick="
		score.wins = 0;
		score.losses = 0;
		score.ties = 0;
		localStorage.removeItem('score');
		updateScoreElement();

		alert('Score was reseted')
		"
		>
			Reset Score
		</button>
		<script>
			let score = JSON.parse(localStorage.getItem("score")) || {
				wins: 0,
				losses: 0,
				ties: 0,
			};

			updateScoreElement();

			function updateScoreElement() {
				document.querySelector(
					".js-score"
				).innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties ${score.ties}`;
			}

			/*if (!score) {
			 	score = {
			 		wins: 0,
			 		losses: 0,
			 		ties: 0,m
			};
			}*/

			function playGame(playerMove) {
				playerMove = playerMove.toLowerCase();
				const computerMove = pickcomputerMove();

				let result = "";

				if (playerMove === "scissors") {
					if (computerMove === "rock") {
						result = "You lose!";
					} else if (computerMove === "paper") {
						result = "You win!";
					} else {
						result = "Tie!";
					}
				} else if (playerMove === "paper") {
					if (computerMove === "rock") {
						result = "You win!";
					} else if (computerMove === "paper") {
						result = "Tie!";
					} else {
						result = "You lose!";
					}
				} else if (playerMove === "rock") {
					if (computerMove === "rock") {
						result = "Tie!";
					} else if (computerMove === "paper") {
						result = "You lose!";
					} else {
						result = "You win!";
					}
				}

				if (result === "You win!") {
					score.wins++;
				} else if (result === "You lose!") {
					score.losses++;
				} else if (result === "Tie!") {
					score.ties++;
				}

				localStorage.setItem("score", JSON.stringify(score));

				updateScoreElement();

				document.querySelector(".js-result").innerHTML = result;

				document.querySelector(
					".js-moves"
				).innerHTML = `You ${playerMove} - ${computerMove} Computer`;
			}

			function pickcomputerMove() {
				const randomNumber = Math.random();
				let computerMove = "";
				if (randomNumber >= 0 && randomNumber < 1 / 3) {
					computerMove = "Rock";
				} else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
					computerMove = "Paper";
				} else if (randomNumber >= 2 / 3 && randomNumber < 1) {
					computerMove = "Scissors";
				}

				return computerMove;
			}
		</script>
	</body>
</html>
