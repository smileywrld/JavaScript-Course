<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excercise</title>
</head>

<body>
    <script>
        let coffeePrice = 5;
        let bagelPrice = 3;
        let soupPrice = 9;
        let Cost = coffeePrice + (bagelPrice * 2) + soupPrice;
        console.log(`Cost of Food $${Cost}`);

        let taxPrice = Cost * 0.1;
        console.log( `Tax (10%) $${taxPrice}`);

        let totalCost =  Cost + taxPrice;
        console.log(`Total cost: $${totalCost}`)
    </script>
</body>
